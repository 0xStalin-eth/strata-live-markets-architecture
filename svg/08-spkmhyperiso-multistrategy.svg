<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="The isolated strategy topology: junior and senior tranches feed one CDO, which points at an IsolatedStrategy owning two sub-strategies — a liquid Spark USDC leg and an illiquid Midas mHYPER leg — with a rebalancer between them. The shares cooldown hangs off the CDO, the ERC20 cooldown serves both legs, and the unstake cooldown serves the Midas leg only.">
  <title>The isolated strategy topology: junior and senior tranches feed one CDO, which points at an IsolatedStrategy owning two sub-strategies — a liquid Spark USDC leg and an illiquid Midas mHYPER leg — with a rebalancer between them. The shares cooldown hangs off the CDO, the ERC20 cooldown serves both legs, and the unstake cooldown serves the Midas leg only.</title>
  <style>
    rect.dg-box { fill: #F3F5F8; stroke: #CFD5DE; stroke-width: 1.2; }
    rect.dg-core { fill: #E9EAF6; stroke: #3A41A0; stroke-width: 1.4; }
    rect.dg-jr { fill: #F6ECE2; stroke: #A9571A; stroke-width: 1.4; }
    rect.dg-sr { fill: #E5F1EE; stroke: #0F6959; stroke-width: 1.4; }
    rect.dg-ext { fill: #F6E9EF; stroke: #8A3F63; stroke-width: 1.4; }
    rect.dg-cool { fill: #E4EFF6; stroke: #1F6390; stroke-width: 1.4; }
    rect.dg-dash { fill: none; stroke: #CFD5DE; stroke-width: 1.2; stroke-dasharray: 3 3; }
    rect.dg-coolgroup { fill: none; stroke: #1F6390; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .dg-t { font-family: Archivo, sans-serif; font-size: 13px; font-weight: 600; fill: #14171F; }
    .dg-s { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: #667180; }
    .dg-glb { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .12em; fill: #667180; }
    .dg-cglb { font-family: "IBM Plex Mono", monospace; font-size: 9.5px; letter-spacing: .12em; fill: #1F6390; }
    .dg-lb { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: #667180; }
    .dg-clb { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: #1F6390; }
    .dg-off { font-family: Archivo, sans-serif; font-size: 13px; font-weight: 600; fill: #667180; }
    .dg-edge { stroke: #3D4552; stroke-width: 1.3; fill: none; }
    .dg-edge-soft { stroke: #667180; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
    .dg-edge-jr { stroke: #A9571A; stroke-width: 1.4; fill: none; }
    .dg-edge-sr { stroke: #0F6959; stroke-width: 1.4; fill: none; }
    .dg-edge-ext { stroke: #8A3F63; stroke-width: 1.3; fill: none; }
    .dg-edge-cool { stroke: #1F6390; stroke-width: 1.4; fill: none; }
    .dg-head { fill: #3D4552; }
    .dg-head-soft { fill: #667180; }
    .dg-head-jr { fill: #A9571A; }
    .dg-head-sr { fill: #0F6959; }
    .dg-head-ext { fill: #8A3F63; }
    .dg-head-cool { fill: #1F6390; }
  </style>
  <defs>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head" points="0,1 10,5 0,9"></polygon>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head-soft" points="0,1 10,5 0,9"></polygon>
    </marker>
    <marker id="aj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head-jr" points="0,1 10,5 0,9"></polygon>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head-sr" points="0,1 10,5 0,9"></polygon>
    </marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head-ext" points="0,1 10,5 0,9"></polygon>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <polygon class="dg-head-cool" points="0,1 10,5 0,9"></polygon>
    </marker>
  </defs>
  </defs>

        <rect class="dg-dash" x="16" y="14" width="240" height="112" rx="4"></rect>
        <text class="dg-glb" x="28" y="32">TRANCHES</text>
        <rect class="dg-jr" x="28" y="42" width="104" height="74" rx="3"></rect>
        <text class="dg-t" x="40" y="66">jrIsoSpk</text>
        <text class="dg-s" x="40" y="84">junior</text>
        <text class="dg-s" x="40" y="100">funds Spark</text>
        <rect class="dg-sr" x="140" y="42" width="104" height="74" rx="3"></rect>
        <text class="dg-t" x="152" y="66">srIsoMHYPER</text>
        <text class="dg-s" x="152" y="84">senior</text>
        <text class="dg-s" x="152" y="100">funds Midas</text>

        <line class="dg-edge-jr" x1="80" y1="116" x2="80" y2="150" marker-end="url(#aj)"></line>
        <path class="dg-edge-sr" d="M192 116 L150 150" marker-end="url(#at)"></path>

        <rect class="dg-core" x="20" y="150" width="160" height="60" rx="3"></rect>
        <text class="dg-t" x="34" y="176">StrataCDO</text>
        <text class="dg-s" x="34" y="194">sees one strategy</text>
        <line class="dg-edge" x1="180" y1="180" x2="250" y2="180" marker-end="url(#a)"></line>

        <rect class="dg-core" x="250" y="140" width="190" height="80" rx="3"></rect>
        <text class="dg-t" x="264" y="166">IsolatedStrategy</text>
        <text class="dg-s" x="264" y="183">is MultiStrategy</text>
        <text class="dg-s" x="264" y="198">junior floor 30%</text>
        <text class="dg-s" x="264" y="213">holds no cooldowns</text>

        <path class="dg-edge-jr" d="M440 162 L520 85" marker-end="url(#aj)"></path>
        <text class="dg-lb" x="452" y="112">junior leg</text>
        <path class="dg-edge-sr" d="M440 198 L520 275" marker-end="url(#at)"></path>
        <text class="dg-lb" x="452" y="252">senior leg</text>

        <rect class="dg-jr" x="520" y="54" width="190" height="62" rx="3"></rect>
        <text class="dg-t" x="534" y="78">SparkUSDCStrategy</text>
        <text class="dg-s" x="534" y="95">liquid · instant redeem</text>
        <line class="dg-edge-ext" x1="710" y1="85" x2="760" y2="85" marker-end="url(#ax)"></line>
        <rect class="dg-ext" x="760" y="54" width="160" height="62" rx="3"></rect>
        <text class="dg-t" x="774" y="82">Spark USDC</text>
        <text class="dg-s" x="774" y="98">vault</text>

        <rect class="dg-sr" x="520" y="244" width="190" height="62" rx="3"></rect>
        <text class="dg-t" x="534" y="268">MidasStrategy</text>
        <text class="dg-s" x="534" y="285">illiquid · queued redeem</text>
        <line class="dg-edge-ext" x1="710" y1="275" x2="760" y2="275" marker-end="url(#ax)"></line>
        <rect class="dg-ext" x="760" y="244" width="160" height="62" rx="3"></rect>
        <text class="dg-t" x="774" y="272">mHYPER</text>
        <text class="dg-s" x="774" y="288">Midas vaults</text>

        <line class="dg-edge-soft" x1="595" y1="116" x2="595" y2="158" marker-start="url(#as)" marker-end="url(#as)"></line>
        <line class="dg-edge-soft" x1="595" y1="202" x2="595" y2="244" marker-start="url(#as)" marker-end="url(#as)"></line>
        <rect class="dg-dash" x="526" y="158" width="178" height="44" rx="3"></rect>
        <text class="dg-t" x="540" y="178">Rebalancer</text>
        <text class="dg-s" x="540" y="193">skips cooldowns</text>

        <text class="dg-glb" x="58" y="256">ROUTING BY TRANCHE</text>
        <text class="dg-s" x="58" y="274">deposit → the tranche's own leg</text>
        <text class="dg-s" x="58" y="290">withdraw → the other leg first</text>
        <text class="dg-s" x="58" y="306">legs read isJrt() via the parent</text>

        <rect class="dg-coolgroup" x="250" y="344" width="670" height="80" rx="4"></rect>
        <text class="dg-cglb" x="262" y="362">COOLDOWNS ON WITHDRAWAL</text>
        <rect class="dg-cool" x="262" y="370" width="205" height="42" rx="3"></rect>
        <text class="dg-t" x="274" y="388">SharesCooldown</text>
        <text class="dg-s" x="274" y="403">jrt 7d / 3d · srt 0 lock</text>
        <rect class="dg-cool" x="479" y="370" width="205" height="42" rx="3"></rect>
        <text class="dg-t" x="491" y="388">ERC20Cooldown</text>
        <text class="dg-s" x="491" y="403">shared by both legs</text>
        <rect class="dg-cool" x="696" y="370" width="210" height="42" rx="3"></rect>
        <text class="dg-t" x="708" y="388">UnstakeCooldown</text>
        <text class="dg-s" x="708" y="403">Midas leg only</text>

        <path class="dg-edge-cool" d="M40 210 L40 391 L262 391" marker-end="url(#ac)"></path>
        <text class="dg-clb" x="48" y="232">shares</text>
        <path class="dg-edge-cool" d="M520 85 L500 85 L500 370" marker-end="url(#ac)"></path>
        <line class="dg-edge-cool" x1="600" y1="306" x2="600" y2="370" marker-end="url(#ac)"></line>
        <text class="dg-clb" x="506" y="338">tokens</text>
        <path class="dg-edge-cool" d="M690 306 L790 370" marker-end="url(#ac)"></path>
        <text class="dg-clb" x="716" y="338">unstake</text>
</svg>

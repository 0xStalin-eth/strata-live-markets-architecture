<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 356" width="940" height="356" role="img" aria-label="Saturn market: junior and senior USDat tranches feed the CDO, which stakes into the sUSDat vault; all three cooldown rails are wired.">
